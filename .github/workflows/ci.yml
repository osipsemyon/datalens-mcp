name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # check:tools = build + conformance audit. The audit also fail-closes on a tampered/expanded
      # OpenAPI spec (unexpected method names, destructive-looking verbs), so keep it in CI.
      - run: npm ci
      - run: npm run check:tools
      - run: npm test
